[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyBusPirateLite"
version = "1.0.0"
description = "Python library for BusPirate"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-or-later"}
keywords = ["BusPirate"]
authors = [
    {name = "Garrett Berg", email = "cloudform511@gmail.com"},
    {name = "Juha Schildt", email = "juha.schildt@iki.fi"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyserial>=3.0",
]

[project.urls]
Homepage = "https://github.com/juhasch/pyBusPirateLite"
Documentation = "https://pybuspiratelite.readthedocs.io/"
Repository = "https://github.com/juhasch/pyBusPirateLite"
Issues = "https://github.com/juhasch/pyBusPirateLite/issues"
Bug-Tracker = "https://github.com/juhasch/pyBusPirateLite/issues"

[tool.setuptools]
packages = ["pyBusPirateLite"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "build>=1.0",
    "twine>=4.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints>=1.0",
]

[tool.black]
line-length = 88
target-version = ['py36']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --cov=pyBusPirateLite"

[tool.coverage.run]
source = ["pyBusPirateLite"]
omit = ["tests/*", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
] 